<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Habit Tracker & Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 max-w-2xl mx-auto font-sans">

  <!-- Header & Navigation Tabs -->
  <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
    <h1 class="text-2xl font-bold text-emerald-400">Habit Tracker</h1>
    <div class="flex space-x-2 bg-slate-800 p-1 rounded-lg border border-slate-700">
      <button id="tab-log-btn" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-emerald-500 text-slate-900 transition">Log Today</button>
      <button id="tab-analytics-btn" class="px-4 py-1.5 rounded-md text-sm font-semibold text-slate-400 hover:text-slate-200 transition">Analytics</button>
    </div>
  </div>

  <!-- TAB 1: LOGGING VIEW -->
  <div id="view-log">
    <form id="habit-form" class="space-y-6">
      
      <!-- PROMINENT DATE PICKER (Mobile-Optimized) -->
      <div class="bg-amber-500/10 border-2 border-amber-500/40 p-4 rounded-xl shadow-lg w-full box-border">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
          <label for="log-date" class="block text-sm font-bold text-amber-300 uppercase tracking-wider">Logging Date</label>
          <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-medium">Defaulted to Yesterday</span>
        </div>
        <input 
          type="date" 
          id="log-date" 
          class="w-full box-border bg-slate-800 text-amber-100 font-semibold rounded-lg px-3 py-2 border border-amber-500/40 focus:outline-none focus:ring-2 focus:ring-amber-400 text-base sm:text-lg max-w-full"
        />
      </div>

      <!-- HABIT CHECKLIST WITH INLINE STREAKS -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <label class="block text-sm font-medium text-slate-300 mb-3">Habits Completed</label>
        <div id="habit-list" class="space-y-3">
          <!-- Populated dynamically with checkboxes + flame badges -->
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 px-4 rounded-xl text-slate-950 transition shadow-lg shadow-emerald-500/10">
        Save Log Entries
      </button>

      <p id="status-msg" class="text-sm text-center font-medium min-h-[20px]"></p>
    </form>
  </div>

  <!-- TAB 2: ANALYTICS VIEW -->
  <div id="view-analytics" class="hidden space-y-6">
    
    <!-- Habit Selector Dropdown -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between">
      <label for="habit-select" class="text-sm font-medium text-slate-300">Select Habit:</label>
      <select id="habit-select" class="bg-slate-700 text-white rounded-lg px-3 py-1.5 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <!-- Options populated dynamically -->
      </select>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <span class="text-xs text-slate-400 font-medium uppercase">Current Streak</span>
        <div id="stat-current-streak" class="text-3xl font-extrabold text-amber-400 mt-1">🔥 0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <span class="text-xs text-slate-400 font-medium uppercase">Best Streak</span>
        <div id="stat-best-streak" class="text-3xl font-extrabold text-emerald-400 mt-1">🏆 0</div>
      </div>
    </div>

    <!-- Heatmap Grid -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <h3 class="text-sm font-semibold text-slate-300 mb-3">Last 30 Days Consistency Grid</h3>
      <div id="heatmap-container" class="heatmap-grid">
        <!-- 30 square tiles generated dynamically -->
      </div>
      <div class="flex items-center justify-end space-x-2 mt-4 text-xs text-slate-400">
        <span>Missed</span>
        <div class="w-3 h-3 bg-slate-700 rounded-sm"></div>
        <div class="w-3 h-3 bg-emerald-500 rounded-sm"></div>
        <span>Completed</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURATION ---
    const SUPABASE_URL = 'https://cweudsoshirocewsxltq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_v8bViIUVpF3IneYE-BkP_g_xe4odXO6';
    // ✅ FIXED: Name the client variable supabaseClient
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // List of habits to track (you can add or edit habits here anytime)
    const HABITS = [
      "Drink water",
"Eat well",
"Sleep on time",
"Brush your teeth",
"Shower",
"Don't goon",
"Don't crack your knuckles",
"Don't eat your boogers",
"Don't be negative with Charlotte",
"Don't play games for too long"
    ];


    let allLogs = [];

    // --- 2. INITIALIZATION ---
    const dateInput = document.getElementById('log-date');
    const habitListContainer = document.getElementById('habit-list');
    const habitSelect = document.getElementById('habit-select');

    // Default Date to Yesterday
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    dateInput.value = yesterday.toISOString().split('T')[0];

    // Populate Checkbox List (Mobile-Responsive with Non-Wrapping Badges)
    HABITS.forEach(habit => {
      const wrapper = document.createElement('label');
      wrapper.className = 'flex items-center justify-between gap-3 bg-slate-700/40 p-3 rounded-lg hover:bg-slate-700/70 cursor-pointer border border-slate-700/50 min-w-0';
      wrapper.innerHTML = `
        <div class="flex items-start space-x-3 min-w-0">
          <input type="checkbox" value="${habit}" class="habit-checkbox w-5 h-5 rounded accent-emerald-500 bg-slate-600 border-slate-500 mt-0.5 shrink-0">
          <span class="text-slate-200 font-medium text-sm sm:text-base leading-snug break-words">${habit}</span>
        </div>
        <span id="streak-badge-${slugify(habit)}" class="shrink-0 whitespace-nowrap text-xs font-semibold bg-amber-500/10 text-amber-400 px-2 py-1 rounded-md border border-amber-500/20">🔥 0 d</span>
      `;
      habitListContainer.appendChild(wrapper);
    
      // Populate Analytics Dropdown
      const opt = document.createElement('option');
      opt.value = habit;
      opt.textContent = habit;
      habitSelect.appendChild(opt);
    });

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-0]/g, '-');
    }

    // --- 3. STREAK LOGIC ---
    function computeStreaks(habitName) {
      const filtered = allLogs.filter(l => l.habit_name === habitName && l.completed);
      const uniqueDates = Array.from(new Set(filtered.map(l => l.log_date))).sort();

      if (uniqueDates.length === 0) return { current: 0, best: 0 };

      // Calculate Longest Streak
      let maxRun = 0;
      let currentRun = 0;
      let prevDate = null;

      uniqueDates.forEach(dateStr => {
        const d = new Date(dateStr);
        if (prevDate) {
          const diffDays = Math.round((d - prevDate) / (1000 * 60 * 60 * 24));
          currentRun = (diffDays === 1) ? currentRun + 1 : 1;
        } else {
          currentRun = 1;
        }
        if (currentRun > maxRun) maxRun = currentRun;
        prevDate = d;
      });

      // Calculate Current Active Streak
      let activeRun = 0;
      let checkDate = new Date();
      
      // Allow current streak if completed today or yesterday
      let checkStr = checkDate.toISOString().split('T')[0];
      if (!uniqueDates.includes(checkStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
        checkStr = checkDate.toISOString().split('T')[0];
      }

      while (uniqueDates.includes(checkStr)) {
        activeRun++;
        checkDate.setDate(checkDate.getDate() - 1);
        checkStr = checkDate.toISOString().split('T')[0];
      }

      return { current: activeRun, best: maxRun };
    }

    // --- 4. RENDER ANALYTICS ---
    function renderAnalytics() {
      const selectedHabit = habitSelect.value;
      const streaks = computeStreaks(selectedHabit);

      document.getElementById('stat-current-streak').textContent = `🔥 ${streaks.current}`;
      document.getElementById('stat-best-streak').textContent = `🏆 ${streaks.best}`;

      // Render 30-Day Heatmap Grid
      const container = document.getElementById('heatmap-container');
      container.innerHTML = '';

      const habitLogs = allLogs.filter(l => l.habit_name === selectedHabit);
      const logMap = {};
      habitLogs.forEach(l => logMap[l.log_date] = l.completed);

      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const completed = logMap[dateStr] === true;

        const tile = document.createElement('div');
        tile.className = `h-10 rounded-md flex items-center justify-center text-[10px] font-mono transition ${
          completed ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-700/60 text-slate-500'
        }`;
        tile.title = `${dateStr}: ${completed ? 'Completed' : 'Missed'}`;
        tile.textContent = d.getDate();
        container.appendChild(tile);
      }
    }

    // --- 5. DATA FETCH & SAVE ---
    async function fetchAllData() {
      const { data, error } = await supabaseClient.from('habit_logs').select('*');
      if (!error && data) {
        allLogs = data;
        HABITS.forEach(habit => {
          const s = computeStreaks(habit);
          const badge = document.getElementById(`streak-badge-${slugify(habit)}`);
          if (badge) badge.textContent = `🔥 ${s.current} d`;
        });
        renderAnalytics();
      }
    }

    document.getElementById('habit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('status-msg');
      statusMsg.textContent = "Saving...";
      statusMsg.className = "text-sm text-center font-medium text-amber-400";

      const selectedDate = dateInput.value;
      const checkboxes = document.querySelectorAll('.habit-checkbox');

      const records = Array.from(checkboxes).map(cb => ({
        log_date: selectedDate,
        habit_name: cb.value,
        completed: cb.checked
      }));

      const { error } = await supabaseClient.from('habit_logs').upsert(records, { onConflict: 'log_date,habit_name' });

      if (error) {
        statusMsg.textContent = `Error: ${error.message}`;
        statusMsg.className = "text-sm text-center font-medium text-rose-400";
      } else {
        statusMsg.textContent = "Saved successfully!";
        statusMsg.className = "text-sm text-center font-medium text-emerald-400";
        await fetchAllData();
      }
    });

    // --- 6. TAB SWITCHING ---
    const tabLogBtn = document.getElementById('tab-log-btn');
    const tabAnalyticsBtn = document.getElementById('tab-analytics-btn');
    const viewLog = document.getElementById('view-log');
    const viewAnalytics = document.getElementById('view-analytics');

    tabLogBtn.addEventListener('click', () => {
      viewLog.classList.remove('hidden');
      viewAnalytics.classList.add('hidden');
      tabLogBtn.className = "px-4 py-1.5 rounded-md text-sm font-semibold bg-emerald-500 text-slate-900 transition";
      tabAnalyticsBtn.className = "px-4 py-1.5 rounded-md text-sm font-semibold text-slate-400 hover:text-slate-200 transition";
    });

    tabAnalyticsBtn.addEventListener('click', () => {
      viewAnalytics.classList.remove('hidden');
      viewLog.classList.add('hidden');
      tabAnalyticsBtn.className = "px-4 py-1.5 rounded-md text-sm font-semibold bg-emerald-500 text-slate-900 transition";
      tabLogBtn.className = "px-4 py-1.5 rounded-md text-sm font-semibold text-slate-400 hover:text-slate-200 transition";
      renderAnalytics();
    });

    habitSelect.addEventListener('change', renderAnalytics);

    // Initial Load
    fetchAllData();
  </script>
</body>
</html>
